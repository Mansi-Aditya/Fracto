<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4">
        <h3 class="text-center mb-4">Admin Login</h3>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" placeholder="Enter admin email" />
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input type="password" class="form-control" [(ngModel)]="password" placeholder="Enter password" />
        </div>

        <p class="text-danger">{{errorMessage}}</p>

        <button class="btn btn-danger w-100" (click)="login()">Admin Login</button>

        <p class="text-center mt-3"><a routerLink="/login">Back to User Login</a></p>
      </div>
    </div>
  </div>
</div>
