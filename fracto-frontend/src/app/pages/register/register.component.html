<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4">
        <h3 class="text-center mb-4">Register</h3>

        <div class="mb-3">
          <label>Username</label>
          <input type="text" class="form-control" [(ngModel)]="username" placeholder="Enter username" />
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" placeholder="Enter email" />
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input type="password" class="form-control" [(ngModel)]="password" placeholder="Min 6 characters" />
        </div>

        <p class="text-danger">{{errorMessage}}</p>
        <p class="text-success">{{successMessage}}</p>

        <button class="btn btn-primary w-100" (click)="register()">Register</button>

        <p class="text-center mt-3">Already have an account? <a routerLink="/login">Login here</a></p>
      </div>
    </div>
  </div>
</div>
