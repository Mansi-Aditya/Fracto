<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h3 class="text-center mb-4">Login</h3>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" placeholder="Enter email" />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="password" placeholder="Enter password" />
        </div>

        <p class="text-danger">{{errorMessage}}</p>

        <button class="btn btn-primary w-100" (click)="login()">Login</button>

        <p class="text-center mt-3">New user? <a href="/register">Register here</a></p>
      </div>
    </div>
  </div>
</div>
