<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h3 class="text-center mb-4">Book Appointment</h3>

        <div class="mb-3">
          <label>Your User ID</label>
          <input type="number" class="form-control" [(ngModel)]="userId" placeholder="Enter your user id" />
        </div>

        <div class="mb-3">
          <label>Doctor ID</label>
          <input type="number" class="form-control" [(ngModel)]="doctorId" placeholder="Enter doctor id" />
        </div>

        <div class="mb-3">
          <label>Date</label>
          <input type="date" class="form-control" [(ngModel)]="appointmentDate" />
        </div>

        <button class="btn btn-secondary w-100 mb-3" (click)="getSlots()">
          Check Available Slots
        </button>

        @if (availableSlots().length > 0) {
          <div class="mb-3">
            <label>Select Time Slot</label>
            <select class="form-control" [(ngModel)]="timeSlot">
              <option value="">-- Select a slot --</option>
              @for (slot of availableSlots(); track slot) {
                <option [value]="slot">{{slot}}</option>
              }
            </select>
          </div>
          <button class="btn btn-primary w-100" (click)="bookAppointment()">
            Book Appointment
          </button>
        }

        <p style="color:red" class="mt-2">{{errorMessage()}}</p>
        <p style="color:green" class="mt-2">{{successMessage()}}</p>
      </div>
    </div>
  </div>
</div>
